<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Word a HTML Profesional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <script src="libs/sweetalert2.all.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div class="logo-area">
                <span class="logo-icon">📄</span>
                <div>
                    <h1>Conversor Word a HTML</h1>
                    <p class="subtitle">Convierte, edita y exporta documentos profesionales</p>
                </div>
            </div>
        </header>

        <div class="upload-area" id="uploadArea">
            <div class="upload-zone">
                <div class="upload-icon">📎</div>
                <h3>Arrastra tu archivo .docx aquí</h3>
                <p>o selecciona un archivo desde tu dispositivo</p>
                <div class="file-input-wrapper">
    <button id="seleccionarArchivoBtn" class="btn-secondary" type="button">📂 Seleccionar archivo</button>
    <span id="nombreArchivoSeleccionado" class="file-name">Ningún archivo seleccionado</span>
</div>
<input type="file" id="inputWord" accept=".docx" style="display: none;">
                <button id="convertirBtn" class="btn-primary">
                    <span class="btn-icon">⚡</span> Convertir a HTML
                </button>
                <button id="editarHtmlBtn" class="btn-editar-html" style="margin-top: 1rem;">📝 Editar HTML</button>
                <input type="file" id="inputHtml" accept=".html" style="display: none;">
            </div>
        </div>

        <div id="resultado" style="display: none;">
            <!-- Barra de herramientas de edición -->
<div id="barraHerramientas" style="display: none;">
    <!-- Pestañas principales -->
    <div class="toolbar-tabs">
        <button class="tab-btn-toolbar active" data-tab="formato">Formato</button>
        <button class="tab-btn-toolbar" data-tab="insertar">Insertar</button>
        <button class="tab-btn-toolbar" data-tab="referencias">Referencias</button>
    </div>

    <!-- Pestaña: Formato -->
    <div class="tab-content-toolbar active" id="tab-formato">
        <div class="toolbar-group">
            <span class="toolbar-label">Fuente</span>
            <select id="fuenteSelect">
                <option value="Times New Roman">Times New Roman</option>
                <option value="Arial">Arial</option>
                <option value="Courier New">Courier New</option>
                <option value="Georgia">Georgia</option>
                <option value="Verdana">Verdana</option>
                <option value="Calibri">Calibri</option>
                <option value="Segoe UI">Segoe UI</option>
                <option value="Crimson Text">Crimson Text</option>
            </select>
            <select id="tamanoSelect">
                <option value="1">10px</option>
                <option value="2">13px</option>
                <option value="3">16px</option>
                <option value="4">18px</option>
                <option value="5">24px</option>
                <option value="6">32px</option>
                <option value="7">48px</option>
            </select>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
            <span class="toolbar-label">Estilo</span>
            <button type="button" class="tool-btn" data-cmd="bold"><b>B</b></button>
            <button type="button" class="tool-btn" data-cmd="italic"><i>I</i></button>
            <button type="button" class="tool-btn" data-cmd="underline"><u>U</u></button>
            <button type="button" class="tool-btn" data-cmd="strikeThrough"><s>S</s></button>
            <button type="button" class="tool-btn" data-cmd="superscript" title="Superíndice">X²</button>
            <button type="button" class="tool-btn" data-cmd="subscript" title="Subíndice">X₂</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
            <span class="toolbar-label">Alinear</span>
            <button type="button" class="tool-btn" data-cmd="justifyLeft">⬅️</button>
            <button type="button" class="tool-btn" data-cmd="justifyCenter">⬌</button>
            <button type="button" class="tool-btn" data-cmd="justifyRight">➡️</button>
            <button type="button" class="tool-btn" data-cmd="justifyFull">☰</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
            <span class="toolbar-label">Listas</span>
            <button type="button" class="tool-btn" data-cmd="insertUnorderedList">•</button>
            <button type="button" class="tool-btn" data-cmd="insertOrderedList">1.</button>
            <button type="button" id="listaLetrasBtn" class="tool-btn" title="Lista con letras (a, b, c)">a.</button>
            <button type="button" id="listaRomanosBtn" class="tool-btn" title="Lista con números romanos (I, II, III)">I.</button>
            <button type="button" class="tool-btn" data-cmd="outdent">←</button>
            <button type="button" class="tool-btn" data-cmd="indent">→</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
            <span class="toolbar-label">Color</span>
            <button type="button" id="colorBtn" class="tool-btn">🎨</button>
            <input type="color" id="colorPicker" value="#000000">
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
            <span class="toolbar-label">Recuadro</span>
            <button type="button" id="recuadroBtn" class="tool-btn">🔲</button>
            <button type="button" id="quitarRecuadroBtn" class="tool-btn danger">❌</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
            <button type="button" class="tool-btn" data-cmd="removeFormat">🗑️ Limpiar</button>
            <button type="button" class="tool-btn" data-cmd="undo">↩️</button>
            <button type="button" class="tool-btn" data-cmd="redo">↪️</button>
        </div>
    </div>

    <!-- Pestaña: Insertar -->
    <div class="tab-content-toolbar" id="tab-insertar">
        <div class="toolbar-group">
            <button type="button" id="insertarImagenBtn" class="tool-btn accent">🖼️ Imagen</button>
            <button type="button" id="insertarTablaBtn" class="tool-btn accent">📊 Tabla</button>
            <button type="button" id="insertarEnlaceBtn" class="tool-btn">🔗 Enlace</button>
            <button type="button" id="anadirLogoBtn" class="tool-btn">🏷️ Logo</button>
        <div class="toolbar-divider"></div>    
            <button type="button" id="insertarLineaBtn" class="tool-btn" title="Insertar línea decorativa">📏 Línea</button>
            <button type="button" id="eliminarLineaBtn" class="tool-btn danger" title="Eliminar línea cercana">❌ Eliminar línea</button>
        <div class="toolbar-divider"></div>
            <button type="button" id="insertarIconoBtn" class="tool-btn accent" title="Insertar icono">🏷️ Icono</button>
            <button type="button" id="eliminarIconoBtn" class="tool-btn danger" title="Eliminar icono cercano">❌ Eliminar icono</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
            <span class="toolbar-label">Tabla</span>
            <button type="button" id="combinarSeleccionBtn" class="tool-btn">🔗 Combinar</button>
            <button type="button" id="eliminarCeldaBtn" class="tool-btn danger">❌ Celda</button>
            <button type="button" id="eliminarFilaBtn" class="tool-btn danger">📄 Fila</button>
            <button type="button" id="eliminarColumnaBtn" class="tool-btn danger">📊 Columna</button>
        </div>
        <div class="toolbar-group" style="margin-left: auto;">
            <div id="controlesLogo" style="display: none;">
                <label>Tamaño: <input type="range" id="logoTamano" min="10" max="300" value="80"></label>
                <label>Opacidad: <input type="range" id="logoOpacidad" min="0" max="1" step="0.05" value="1"></label>
                <button id="aplicarLogoBtn" class="tool-btn mini">Aplicar</button>
            </div>
        </div>
    </div>

    <!-- Pestaña: Referencias -->
    <div class="tab-content-toolbar" id="tab-referencias">
        <div class="toolbar-group">
            <button type="button" id="deshacerSangriaBtn" class="tool-btn" title="Deshacer última sangría">↩️ Deshacer sangría</button>
            <button type="button" id="sangriaFrancesaBtn" class="tool-btn">📑 Sangría francesa</button>
            <button type="button" id="sangriaNormalBtn" class="tool-btn">📝 Sangría normal</button>
            <button type="button" id="numerarReferenciasBtn" class="tool-btn">🔢 Numerar</button>
            <button type="button" id="estiloAPABtn" class="tool-btn">📖 Estilo APA</button>
        </div>
    </div>
</div>            
            <div class="editor-container">
                <div id="vistaPrevia"></div>
            </div>

            <div class="acciones">
                <div class="nombre-archivo">
                    <label for="nombreArchivo">Nombre del archivo:</label>
                    <input type="text" id="nombreArchivo" placeholder="mi_articulo">
                    <span class="extension">.html</span>
                </div>
                <div class="action-buttons">
                    <button id="editarBtn" class="btn-edit">✏️ Editar documento</button>
                    <button id="guardarEdicionBtn" style="display:none;" class="btn-save">💾 Guardar cambios</button>
                    <button id="descargarBtn" class="btn-download">⬇️ Descargar HTML</button>
                    <button id="descargarZipBtn" style="display:none;" class="btn-download-zip">⬇️ Descargar ZIP</button>
                </div>
            </div>
        </div>
    </div>

    <script src="libs/mammoth.browser.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
