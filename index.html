<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Word a HTML</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="libs/sweetalert2.all.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>📄 Convertir Word (.docx) a HTML</h1>
        
        <div class="upload-area">
            <input type="file" id="inputWord" accept=".docx">
            <button id="convertirBtn">Convertir a HTML</button>
        </div>

        <div id="resultado" style="display: none;">
            <div class="tabs">
                <button class="tab-btn active" data-tab="vista">Vista Previa</button>
            </div>

<div id="tab-vista" class="tab-content active">
    <div id="barraHerramientas" style="display: none; background: #f8f9fa; padding: 8px; border-bottom: 2px solid #ddd; margin-bottom: 10px; flex-wrap: wrap; gap: 4px;">
    <span style="font-weight:bold;">Estilo:</span>
    <select id="fuenteSelect" title="Tipo de letra">
        <option value="Times New Roman">Times New Roman</option>
        <option value="Arial">Arial</option>
        <option value="Courier New">Courier New</option>
        <option value="Georgia">Georgia</option>
        <option value="Verdana">Verdana</option>
    </select>
    <select id="tamanoSelect" title="Tamaño">
        <option value="1">10px</option>
        <option value="2">12px</option>
        <option value="3">14px</option>
        <option value="4">16px</option>
        <option value="5">18px</option>
        <option value="6">24px</option>
    </select>
    <button type="button" class="tool-btn" data-cmd="bold" title="Negrita"><b>N</b></button>
    <button type="button" class="tool-btn" data-cmd="italic" title="Cursiva"><i>C</i></button>
    <button type="button" class="tool-btn" data-cmd="underline" title="Subrayado"><u>S</u></button>
    <span style="margin:0 4px">|</span>
    <button type="button" class="tool-btn" data-cmd="justifyLeft" title="Izquierda">⬅️</button>
    <button type="button" class="tool-btn" data-cmd="justifyCenter" title="Centro">⬌</button>
    <button type="button" class="tool-btn" data-cmd="justifyRight" title="Derecha">➡️</button>
    <button type="button" class="tool-btn" data-cmd="justifyFull" title="Justificar">☰</button>
    <span style="margin:0 4px">|</span>
    <button type="button" id="insertarImagenBtn" title="Insertar imagen">🖼️ Imagen</button>
    <button type="button" id="anadirLogoBtn" title="Añadir logotipo de revista">🏷️ Logo</button>
<div id="controlesLogo" style="display: none; background: white; padding: 5px 10px; border-radius: 40px; gap: 10px;">
    <label>Tamaño: <input type="range" id="logoTamano" min="10" max="200" value="80"></label>
    <label>Opacidad: <input type="range" id="logoOpacidad" min="0" max="1" step="0.05" value="1"></label>
    <button id="aplicarLogoBtn">Aplicar</button>
</div>
    <button type="button" class="tool-btn" data-cmd="removeFormat" title="Limpiar formato">🗑️</button>
</div>
    <div id="vistaPrevia"></div>
</div>

            <div class="acciones">
                 <div class="nombre-archivo">
        <label for="nombreArchivo">Nombre del archivo HTML:</label>
        <input type="text" id="nombreArchivo" placeholder="mi_articulo_convertido" style="padding: 0.4rem 0.8rem; border-radius: 40px; border: 1px solid #cbd5e1; font-family: inherit;">
        <span>.html</span>
    </div>
               <button id="editarBtn">✏️ Editar vista previa</button>
               <button id="guardarEdicionBtn" style="display:none;">💾 Guardar cambios</button>
               <button id="descargarBtn">⬇️ Descargar HTML</button>
               <button id="descargarZipBtn" style="display:none;">⬇️ Descargar HTML + Imágenes (ZIP)</button>
            </div>
        </div>
    </div>

    <script src="libs/mammoth.browser.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
